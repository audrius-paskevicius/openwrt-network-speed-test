name: Check and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: node tests/check-js.cjs
      - run: node tests/disclaimer.cjs
      - run: |
          sh -n scripts/build-apk.sh
          sh -n scripts/post-install
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 --remote-debugging-port=9223 --user-data-dir="$RUNNER_TEMP/speed-test-chrome" about:blank > "$RUNNER_TEMP/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9223/json/version > /dev/null; then break; fi
            sleep 1
          done
          node tests/browser-ui.cjs
      - run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o dist/network-speed-test ./cmd/network-speed-test
      - uses: actions/upload-artifact@v4
        with:
          name: network-speed-test-armv7
          path: dist/network-speed-test
